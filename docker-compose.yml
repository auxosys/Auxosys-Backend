version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: auxosys_postgres
    restart: always
    environment:
      POSTGRES_DB: auxosys_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: auxosys_password_123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/000_full_postgres_schema.sql:/docker-entrypoint-initdb.d/000_full_postgres_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auxosys_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: auxosys_backend
    restart: always
    ports:
      - "5002:5002"
    environment:
      NODE_ENV: production
      PORT: 5002
      DB_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: auxosys_db
      DB_USER: postgres
      DB_PASSWORD: auxosys_password_123
      DB_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
